<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monty · Local design preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#181b1d;font:14px system-ui;color:#25272a}nav{height:64px;display:flex;gap:10px;align-items:center;padding:12px 20px;background:#f8f6f1}strong{margin-right:auto}button{border:1px solid #ceb888;background:white;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}button:hover,button:focus{background:#9d2235;color:white}small{color:#63666a;margin-left:12px}iframe{display:block;width:100vw;height:calc(100vh - 64px);border:0}
</style></head><body><nav><strong>Monty · Design preview</strong><button data-state="idle">1 · Idle</button><button data-state="listening">2 · Listening</button><button data-state="heard">3 · Heard</button><button data-state="offline">4 · Offline</button><button data-state="controls">5 · Hidden QR command</button><small>Local simulation · Pi unchanged</small></nav><iframe title="Kiosk voice design" src="/?voice-demo=idle"></iframe><script>
if(!['localhost','127.0.0.1'].includes(location.hostname)){document.body.textContent='Local preview only.';}else{document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const key={idle:'1',listening:'2',heard:'3',offline:'4',controls:'5'}[button.dataset.state];document.querySelector('iframe').contentWindow.document.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));});}
</script></body></html>
